<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Confirm Your Email — ACM Alexandria</title>
</head>
<body>

<div th:replace="~{mail/base-layout :: content(~{::content})}">
    <th:block th:fragment="content">

        <!-- Category Eyebrow Badge -->
        <span style="display: inline-block; background-color: #e0f2fe; color: #0284c7;; font-size: 11px; font-weight: 800; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 20px;">
        Welcome
      </span>

        <!-- Heading -->
        <h1 style="margin: 0 0 16px 0; font-size: 24px; font-weight: 800; color: #0f172a; line-height: 1.3;">
            Confirm Your Email
        </h1>

        <p style="margin: 0 0 16px 0; font-size: 16px; color: #0f172a; line-height: 1.7;">
            Hi <strong th:text="${userName != null ? userName : 'ACM Member'}">ACM Member</strong>,
        </p>

        <p style="margin: 0 0 24px 0; font-size: 15px; color: #334155; line-height: 1.7;">
            Thank you for creating an ACM Alexandria account. Please confirm your email address by clicking the button below:
        </p>

        <!-- CTA Button -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: 36px 0;">
            <tr>
                <td align="center">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                                 xmlns:w="urn:schemas-microsoft-com:office:word"
                                 th:href="${buttonUrl}"
                                 style="height:50px;v-text-anchor:middle;width:260px;"
                                 arcsize="50%"
                                 stroke="false"
                                 fillcolor="#205E85">
                        <w:anchorlock/>
                        <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;">
                            Confirm Email
                        </center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <a th:href="${buttonUrl}"
                       target="_blank"
                       style="display: inline-block; padding: 14px 44px; font-size: 15px; font-weight: 700; color: #ffffff; text-decoration: none; border-radius: 50px; background: linear-gradient(135deg, #4B98C8, #205E85); text-align: center; mso-padding-alt: 14px 44px; transition: all 0.3s ease; box-shadow: 0 4px 14px rgba(75, 152, 200, 0.3);"
                       class="acm-btn">
                        Confirm Email
                    </a>
                    <!--<![endif]-->
                </td>
            </tr>
        </table>

        <!-- Security Notice Card -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: 28px 0 0 0;">
            <tr>
                <td style="background-color: #f8fafc; border-left: 4px solid #ef4444; padding: 18px 24px; border-radius: 0 12px 12px 0;">
                    <p style="margin: 0; font-size: 13px; color: #475569; line-height: 1.6; font-weight: 500;">
                        ⏰ <strong>Notice:</strong> This link is only valid for <strong>15 minutes</strong>. If you did not make this request, you can ignore this email.
                    </p>
                </td>
            </tr>
        </table>

    </th:block>
</div>

</body>
</html>
