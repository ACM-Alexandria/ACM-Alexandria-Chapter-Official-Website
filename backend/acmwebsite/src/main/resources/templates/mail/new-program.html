<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Program Announcement — ACM Alexandria</title>
</head>
<body>

  <div th:replace="~{mail/base-layout :: content(~{::content})}">
    <th:block th:fragment="content">

      <!-- Category Eyebrow Badge -->
      <span style="display: inline-block; background-color: #f0fdf4; color: #16a34a; font-size: 11px; font-weight: 800; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 20px;">
        New Program
      </span>

      <!-- Heading -->
      <h1 style="margin: 0 0 16px 0; font-size: 24px; font-weight: 800; color: #0f172a; line-height: 1.3;" th:text="'New Program: ' + ${programName}">
        New ACM Alexandria Program
      </h1>

      <p style="margin: 0 0 16px 0; font-size: 16px; color: #0f172a; line-height: 1.7;">
        Hi <strong th:text="${userName != null ? userName : 'ACM Member'}">ACM Member</strong>,
      </p>

      <p style="margin: 0 0 24px 0; font-size: 15px; color: #334155; line-height: 1.7;">
        A new ACM Alexandria program has been launched! Check out the details below:
      </p>

      <!-- Program Details Card -->
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
             style="background-color: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 32px;">
        <tr>
          <td style="padding: 24px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
              <!-- Program Name -->
              <tr>
                <td style="padding-bottom: 12px; width: 100px; font-size: 14px; font-weight: 700; color: #64748b; text-transform: uppercase;">Program</td>
                <td style="padding-bottom: 12px; font-size: 15px; font-weight: 700; color: #0f172a;" th:text="${programName}">Program Name</td>
              </tr>
              <!-- Start Date -->
              <tr>
                <td style="padding-bottom: 12px; font-size: 14px; font-weight: 700; color: #64748b; text-transform: uppercase;">Start Date</td>
                <td style="padding-bottom: 12px; font-size: 15px; font-weight: 600; color: #334155;" th:text="${startDate}">Start Date</td>
              </tr>
              <!-- Description -->
              <tr>
                <td style="font-size: 14px; font-weight: 700; color: #64748b; text-transform: uppercase; vertical-align: top; padding-top: 2px;">Description</td>
                <td style="font-size: 15px; font-weight: 600; color: #334155; line-height: 1.6;" th:text="${description}">Description</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

      <!-- CTA Button to register / check out details -->
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: 36px 0;">
        <tr>
          <td align="center">
            <!--[if mso]>
            <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                         xmlns:w="urn:schemas-microsoft-com:office:word"
                         th:href="${buttonUrl != null ? buttonUrl : '#'}"
                         style="height:50px;v-text-anchor:middle;width:240px;"
                         arcsize="50%"
                         stroke="false"
                         fillcolor="#205E85">
               <w:anchorlock/>
               <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;">
                 View Program & Register
               </center>
            </v:roundrect>
            <![endif]-->
            <!--[if !mso]><!-->
            <a th:href="${buttonUrl != null ? buttonUrl : 'http://localhost:5173'}"
               target="_blank"
               style="display: inline-block; padding: 14px 44px; font-size: 15px; font-weight: 700; color: #ffffff; text-decoration: none; border-radius: 50px; background: linear-gradient(135deg, #4B98C8, #205E85); text-align: center; mso-padding-alt: 14px 44px; transition: all 0.3s ease; box-shadow: 0 4px 14px rgba(75, 152, 200, 0.3);"
               class="acm-btn">
              View Program & Register
            </a>
            <!--<![endif]-->
          </td>
        </tr>
      </table>

    </th:block>
  </div>

</body>
</html>
