# Server
server.port=8080

# Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/acm_db
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.jpa.hibernate.ddl-auto=update

# JWT
jwt.secret=your_super_secret_jwt_key_that_should_be_at_least_256_bits_long_for_security
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# CORS
frontend.url=http://localhost:5173
backend.url=http://localhost:8080

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-real-email@gmail.com
spring.mail.password=your_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# THYMELEAF EMAIL TEMPLATE CONFIGURATION

spring.thymeleaf.prefix=classpath:/templates/mail/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false