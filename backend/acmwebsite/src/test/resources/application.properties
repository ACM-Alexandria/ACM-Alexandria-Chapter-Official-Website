# =============================================
# Test-only overrides — used by @SpringBootTest
# Overrides the main application.properties so
# the context can load in CI without real infra.
# =============================================

# Use H2 in-memory database instead of MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable the H2 console
spring.h2.console.enabled=false

# JWT (dummy values — no real auth in tests)
jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithm-padding
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# CORS (dummy)
frontend.url=http://localhost:5173
backend.url=http://localhost:8080
app.frontend.urls=http://localhost:5173

# Mail — use a no-op / dummy SMTP so context loads without a real server
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Admin seeder
admin.email=admin@test.com
admin.password=Test#1234

# Google Sheets (dummy — prevents bean init failure)
google.sheets.client-id=dummy-client-id
google.sheets.client-secret=dummy-client-secret
google.sheets.refresh-token=dummy-refresh-token
google.sheets.events-folder-id=dummy-events-folder
google.sheets.clubs-folder-id=dummy-clubs-folder
google.sheets.committees-registrations-folder-id=dummy-committees-folder

# Cloudinary (dummy)
cloudinary.cloud-name=dummy
cloudinary.api-key=000000000000000
cloudinary.api-secret=dummy-secret

# Disable Swagger in tests (optional, speeds up context load)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
